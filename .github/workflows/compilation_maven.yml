name: Compilation du projet Maven

on:
  push:
    tags:
      - '*.*.*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  compilation:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [21, 25]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Donner les permissions au Maven Wrapper
        run: chmod +x mvnw

      - name: Compiler et exécuter les tests
        run: ./mvnw -B clean verify

      - name: Stocker le JAR comme artefact
        if: matrix.java-version == 25
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-jar
          path: target/atelier-tests-unitaires.jar
          retention-days: 7
